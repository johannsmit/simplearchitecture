# SimpleArchitecture and its own PostgreSQL on one machine. Copy example.env to .env next to this
# file, fill it in, then run `docker compose up -d` here. See guide/docker-compose.md. Every
# setting comes from .env; nothing secret is in this file.
#
# The app reaches PostgreSQL as `db` on the project's own network, without TLS: it allows a plain
# connection only when DATABASE_URL asks for one (sslmode=disable), and only to a host with a
# one-word name like this or to localhost. The database's port isn't published. The app's port is,
# on this machine only: put your https proxy in front of it, as the app expects one, at
# https://<APP_DOMAIN>.
name: simplearchitecture

services:
  db:
    # PostgreSQL 17, pinned by tag and digest. A new major version needs a dump and restore.
    image: postgres:17.11-alpine3.24@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    restart: unless-stopped
    environment:
      POSTGRES_USER: simplearchitecture
      POSTGRES_DB: simplearchitecture
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD, pg_isready, -q, -h, 127.0.0.1, -U, simplearchitecture, -d, simplearchitecture]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  app:
    # A version, never latest (there is none): upgrade by changing SIMPLEARCHITECTURE_VERSION.
    image: ghcr.io/johannsmit/simplearchitecture:${SIMPLEARCHITECTURE_VERSION:?Set SIMPLEARCHITECTURE_VERSION in .env}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # The app's port, on this machine only, for the https proxy. Never expose it to the internet.
    ports:
      - 127.0.0.1:${APP_PORT:?Set APP_PORT in .env}:8080
    # The app writes nothing to its file system and needs no privileges.
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env}
      DATABASE_URL: postgres://simplearchitecture:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/simplearchitecture?sslmode=disable
      OIDC_ISSUER: ${OIDC_ISSUER:?Set OIDC_ISSUER in .env}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?Set OIDC_CLIENT_ID in .env}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?Set OIDC_CLIENT_SECRET in .env}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      OIDC_ROLES_CLAIM: ${OIDC_ROLES_CLAIM:?Set OIDC_ROLES_CLAIM in .env}
      OIDC_ROLE_ADMIN: ${OIDC_ROLE_ADMIN:?Set OIDC_ROLE_ADMIN in .env}
      OIDC_ROLE_MODELLER: ${OIDC_ROLE_MODELLER:?Set OIDC_ROLE_MODELLER in .env}
      OIDC_ROLE_VIEWER: ${OIDC_ROLE_VIEWER:?Set OIDC_ROLE_VIEWER in .env}
    # The image's own health check, written out: the API answers once the migrations have run.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

volumes:
  db-data:
